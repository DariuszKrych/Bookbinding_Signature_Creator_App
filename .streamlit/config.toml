# --------------------------------------------------------------------------
# Strip the developer chrome
# --------------------------------------------------------------------------
# This is a local tool with one job, not a Streamlit app someone is building.
# Everything in the top-right corner that exists to *develop* an app is noise
# here, and some of it is worse than noise: Rerun and Stop both interrupt a
# conversion in progress, which is the one thing the whole page-drawing order in
# app.py is arranged to prevent.
#
# "minimal" hides the Deploy button, Rerun, Auto rerun and Clear cache, and also
# Print and Record screen — "viewer" would leave those last two behind. What it
# leaves behind is the System / Light / Dark switcher and the "Made with
# Streamlit v…" footer.
#
# Neither of those is wanted in the corner either, and no config option reaches
# them. Nor can they simply be left unbuilt: in minimal mode Streamlit builds
# the corner only for an app that has defined a menu item of its own, and with
# no corner there is no switcher anywhere on the page — so app.py keeps the
# About entry that builds it, hides the lot with a style block, and drives that
# same switcher from the top of the sidebar instead.
[client]
toolbarMode = "minimal"

# No traceback is ever drawn on the page.
#
# Streamlit's default is to print an uncaught exception, with its source lines,
# straight into the browser. That is the right default for somebody debugging on
# their own machine and the wrong one for a public URL: this app now holds an
# OpenRouter key in its environment, and a traceback is exactly the kind of thing
# that carries request context out of a process by accident.
#
# `Script/ai_book.py` scrubs anything key-shaped out of the messages it raises,
# and never lets the client's own exception escape, so this is the second of two
# locks rather than the only one. It costs nothing that matters: every failure a
# visitor is meant to see is written by `finish()` as an ordinary `st.error`, and
# those are unaffected.
#
# Set this back to "full" while working on the app itself, the same way
# `fileWatcherType` below wants setting back to "auto".
showErrorDetails = "none"

# --------------------------------------------------------------------------
# No telemetry
# --------------------------------------------------------------------------
# Streamlit gathers anonymous usage statistics by default — `gatherUsageStats`
# ships as `true` — and sends them to Snowflake, in the United States, through
# Segment. It carries nothing out of an app's content: not the text, not the
# files, not the books. It is the framework counting which of its own commands
# get called, from an installation id it keeps in `~/.streamlit/machine_id_v4`.
#
# It goes anyway, and the reason is the same one the whole of
# `Script/workspace.py` exists for. The data policy at the foot of the page says
# that nothing leaves this app and that there is no analytics vendor in the
# picture. A footnote conceding "except for the framework's own" would be an
# accurate sentence and a worse promise: the point of the position is that a
# visitor need not read a policy to work out what is being sent about them,
# because the answer is nothing.
#
# This is the switch itself, not a request to be left alone. In streamlit 1.59
# the option gates the collection at source (`runtime/metrics_util.py`: no
# tracking without `ctx.gather_usage_stats`, and no `machine_id_v4` file
# written at all) and is handed to the browser in the NewSession message
# (`runtime/app_session.py`), which is what stops the frontend's own call. Setting
# it here by hand also suppresses the "Collecting usage statistics. To
# deactivate…" line and the email prompt Streamlit shows on a first run
# (`runtime/credentials.py`).
[browser]
gatherUsageStats = false

[server]
# Streamlit has one upload ceiling for the whole app, and this app has two
# uploads that want different ones: a data zip carrying a whole session, and a
# single book PDF, capped at 100 MB (`MAX_UPLOAD_BYTES` in Script/workspace.py)
# so that uploading one book cannot fill the session it then has to be converted
# inside. So this is set for the larger of the two, and the PDF cap is enforced
# in `app.py` instead, on the bytes as they arrive.
#
# It is 12 MB above the session limit rather than equal to it, and that margin
# is the whole point of the number.
#
# This is a ceiling on the size of one *file*. The session limit is 500 MB of
# unpacked bytes on disk. Those are not the same quantity, and zipping does not
# close the gap in the direction anyone expects. Drafts are JSON and shrink to
# almost nothing, which is what makes a zip of a *lightly used* session look
# tiny beside the usage bar — but the bulk of a full session is PDF, which is
# already compressed internally, so deflate hands back what it was given and the
# zip's own per-entry headers then add on top. Measured: 500 MB of
# incompressible content packs to 500.2 MB in a handful of large files, and to
# 505.7 MB spread over four thousand small ones (~119 bytes of headers each).
#
# So a full session zips to *more* than 500 MB, not less, and at a ceiling of
# exactly 500 the browser would refuse the zip the app itself had just written,
# with the visitor's whole session in it. That is the bug this margin closes.
# 512 clears the measured worst case by 6 MB and is only reachable past roughly
# a hundred thousand entries, which the 500 MB quota makes absurd.
#
# Nobody does see it. Streamlit prints this figure under both dropzones, and
# under both it would be answering a question nobody asked — the book uploader's
# real limit is 100 MB, and what decides a zip is not its size but what it
# unpacks to. Both lines are replaced in the style block at the top of app.py.
#
# Neither number is a quota. What stops a hundred small files adding up to more
# than one session may keep is `workspace.guard`.
maxUploadSize = 512

# No source-file watcher. Its only visible output is the "File change. Rerun /
# Always rerun" prompt in the header — a developer's control, offered to someone
# who is here to fold paper and cannot edit the source from the browser anyway.
# Turned off at the source rather than hidden, so nothing is watching for edits
# that will not happen. Set this back to "auto" while working on the app itself.
fileWatcherType = "none"

# --------------------------------------------------------------------------
# Theme: paper and foliage.
# --------------------------------------------------------------------------
#
# The app is about paper, so the page is an off-white with a little green in it
# rather than a flat white, and the accents are leaf greens. Every colour here
# was picked against its own background for contrast, not by eye: body text is
# ~14:1 on the page, captions and secondary text stay above 4.5:1, and the green
# used behind white button text is dark enough to clear 4.5:1 on its own.
#
# Both appearance modes are defined, so the sidebar's Light/Dark switch moves
# between two versions of the same palette instead of dropping back to
# Streamlit's stock colours in one of them.

[theme]
base = "light"
font = "sans-serif"
# Softer corners than the default: this is a hobby tool, not a control panel.
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
# The page and the cards are close in tone, so inputs need an outline to read as
# inputs rather than as patches of background.
showWidgetBorder = true

# --------------------------------------------------------------------------
# Light — pale paper, leaf accents
# --------------------------------------------------------------------------
[theme.light]
backgroundColor = "#F6FAF2"           # paper with a green cast
secondaryBackgroundColor = "#E7F1DE"  # sage, for cards and widget fills
textColor = "#1C2B1F"                 # deep forest; ~14:1 on the page
primaryColor = "#2E7D32"              # leaf green; 5.1:1 under white button text
linkColor = "#256B2A"
borderColor = "#CBDEBB"
codeBackgroundColor = "#EDF5E4"
codeTextColor = "#27512C"

# Success messages should belong to the palette — they are the app's good news.
# Red, orange, yellow and blue are left at Streamlit's defaults on purpose: an
# error or a warning has to break out of the green, not blend into it.
greenColor = "#2E7D32"
greenBackgroundColor = "#DCEDD2"
greenTextColor = "#1E5B23"

[theme.light.sidebar]
backgroundColor = "#E9F3E1"           # a shade deeper, so the panel reads as one
secondaryBackgroundColor = "#F7FBF3"  # near-white widget fills on the sage panel
borderColor = "#C4D9B3"
codeBackgroundColor = "#F7FBF3"

# --------------------------------------------------------------------------
# Dark — the same palette after sundown
# --------------------------------------------------------------------------
[theme.dark]
backgroundColor = "#121A11"
secondaryBackgroundColor = "#1D271B"
textColor = "#E4EEDC"
primaryColor = "#7CC47F"              # lifted, so it carries on a dark ground
linkColor = "#9AD79C"
borderColor = "#2F3D2B"
codeBackgroundColor = "#1A2318"
codeTextColor = "#B7DDB6"

greenColor = "#7CC47F"
greenBackgroundColor = "#1F3320"
greenTextColor = "#A6DCA8"

[theme.dark.sidebar]
backgroundColor = "#161F14"
secondaryBackgroundColor = "#212C1E"
borderColor = "#2F3D2B"
codeBackgroundColor = "#212C1E"
